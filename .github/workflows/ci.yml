name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Check application syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check model-specs.js
          node --check renderer/app.js
      - name: Run offline renderer smoke tests
        # GitHub-hosted Linux runners execute this Electron test as an
        # unprivileged checkout, so Electron's packaged SUID sandbox helper
        # cannot be configured. The test is offline and runs only repo code.
        run: xvfb-run --auto-servernum ./node_modules/.bin/electron --no-sandbox test/smoke.js
      - name: Run production boot test
        run: xvfb-run --auto-servernum ./node_modules/.bin/electron --no-sandbox test/real-boot.js

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build a Linux desktop artifact
        run: npm run build -- --linux dir

  macos:
    name: macOS offline boot and package validation
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exercise renderer and production boot without generation calls
        run: |
          npm test
          npm run test:boot
      - name: Build and verify the real macOS app bundle
        run: node scripts/ci-macos-package.mjs
      - name: Retain package validation summary and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-package-smoke
          path: |
            artifacts/macos-package.json
            test/*screenshot.png
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI required
    if: ${{ always() }}
    needs: ["test", "build", "macos", "merge-policy"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("Unsuccessful prerequisites: " + ", ".join(failed))
          PY
  merge-policy:
    name: Validate merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github/tests -p 'test_merge_validated_pr.py'
