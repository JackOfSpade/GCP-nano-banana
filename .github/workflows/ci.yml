name: CI

# CI must run for every pushed branch because the post-CI auto-merge workflow
# verifies the exact branch-tip SHA before it can merge that branch into main.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Check application syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check model-specs.js
          node --check renderer/app.js
      - name: Run offline renderer smoke tests
        # GitHub-hosted Linux runners execute this Electron test as an
        # unprivileged checkout, so Electron's packaged SUID sandbox helper
        # cannot be configured. The test is offline and runs only repo code.
        run: xvfb-run --auto-servernum ./node_modules/.bin/electron --no-sandbox test/smoke.js
      - name: Run production boot test
        run: xvfb-run --auto-servernum ./node_modules/.bin/electron --no-sandbox test/real-boot.js

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build a Linux desktop artifact
        run: npm run build -- --linux dir
