<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nano Banana Pro</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <!-- ============== SIDEBAR ============== -->
  <aside class="sidebar">
    <button id="new-chat" class="new-chat-btn">＋&nbsp; New chat <span class="kbd">⌘N</span></button>
    <div class="sidebar-search">
      <input id="chat-search" type="search" placeholder="Search chats…" autocomplete="off" />
    </div>
    <div id="chat-list" class="chat-list" aria-label="Chats"></div>
  </aside>

  <!-- ============== MAIN ============== -->
  <main class="main">

    <!-- Top bar -->
    <header class="topbar">
      <button id="model-chip" class="model-chip" data-popup="model-popup" title="Select model">
        <span class="logo">🍌</span>
        <span id="model-chip-label" class="model-chip-label">Nano Banana Pro</span>
        <span class="caret">▾</span>
      </button>
      <div class="topbar-actions">
        <span id="auth-mode" class="auth-pill">checking auth…</span>
        <span id="session-cost" class="stat-pill" title="Approx Vertex AI cost this session ($2/M input · $120/M output)">$0.00</span>
        <button id="report-issue" class="ghost-btn small" title="Report an issue with diagnostics">🐞</button>
      </div>
    </header>

    <!-- Conversation -->
    <div id="conversation" class="conversation">
      <div id="conversation-inner" class="conversation-inner"></div>
    </div>

    <!-- Composer -->
    <div class="composer-wrap">
      <div class="composer">
        <div id="ref-strip" class="ref-strip"></div>
        <textarea id="prompt" rows="1" placeholder="Describe what to generate, or edit the references…"></textarea>
        <div class="composer-toolbar">
          <button id="ref-browse" class="icon-btn" title="Attach reference images">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 17.93 8.83l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input id="ref-input" type="file" accept="image/*" multiple hidden />

          <button id="aspect-chip" class="chip" data-popup="aspect-popup" title="Aspect ratio">
            <span id="aspect-chip-label">auto</span><span class="caret">▾</span>
          </button>

          <button id="size-chip" class="chip" data-popup="size-popup" title="Image size">
            <span id="size-chip-label">1K</span><span class="caret">▾</span>
          </button>

          <button id="settings-chip" class="chip" data-popup="settings-popup" title="All settings">
            <span>⚙ Settings</span><span class="caret">▾</span>
          </button>

          <label class="stream-toggle" title="Stream response">
            <input type="checkbox" id="stream" checked />
            <span>stream</span>
          </label>

          <span class="grow"></span>

          <button id="generate" class="send-btn" title="Send (⌘/Ctrl+Enter)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg>
          </button>
          <button id="stop" class="stop-btn" hidden title="Stop">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- ============== Drop-ups (anchored to chips and topbar) ============== -->

<div id="model-popup" class="popup" hidden>
  <div class="popup-title">Model</div>
  <div id="model-list" class="opt-list opt-list-2line"></div>
</div>

<div id="aspect-popup" class="popup" hidden>
  <div class="popup-title">Aspect ratio</div>
  <div id="aspect-grid" class="aspect-grid"></div>
</div>

<div id="size-popup" class="popup" hidden>
  <div class="popup-title">Image size</div>
  <div id="size-list" class="opt-list"></div>
</div>

<div id="settings-popup" class="popup popup-wide" hidden>
  <div id="settings-banner" class="settings-banner"></div>
  <div class="popup-tabs">
    <button class="popup-tab active" data-tab="image">Image</button>
    <button class="popup-tab" data-tab="sampling">Sampling</button>
    <button class="popup-tab" data-tab="instruction">Instruction</button>
    <button class="popup-tab" data-tab="presets">Presets</button>
  </div>
  <div class="popup-body">

    <section class="popup-section" data-section="image">
      <div class="grid-2">
        <label><span>Person generation</span><select id="person_generation"></select></label>
        <label><span>Prominent people</span><select id="prominent_people"><option value="">(unset)</option></select></label>
      </div>
      <label class="full">
        <span>Response modalities</span>
        <div id="response_modalities" class="chips"></div>
      </label>
      <label class="check full">
        <input type="checkbox" id="google_search" />
        <span>Enable Google Search grounding</span>
      </label>
    </section>

    <section class="popup-section" data-section="sampling" hidden>
      <div class="grid-2">
        <label><span>Temperature <em id="temp-val">1.00</em></span><input type="range" id="temperature" min="0" max="2" step="0.05" value="1" /></label>
        <label><span>Top P <em id="topp-val">0.95</em></span><input type="range" id="top_p" min="0" max="1" step="0.01" value="0.95" /></label>
        <label><span>Seed</span>
          <div class="seed-row">
            <input type="number" id="seed" placeholder="(random)" />
            <button id="seed-dice" type="button" class="ghost-btn" title="Randomize seed">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
            </button>
          </div>
        </label>
      </div>
    </section>

    <section class="popup-section" data-section="instruction" hidden>
      <label class="full">
        <span>System instruction</span>
        <textarea id="system_instruction" rows="6" placeholder="e.g. You are a meticulous concept artist."></textarea>
      </label>
    </section>

    <section class="popup-section" data-section="presets" hidden>
      <div class="preset-row">
        <select id="preset-select"><option value="">(no preset)</option></select>
        <button id="preset-load" class="ghost-btn">Load</button>
        <button id="preset-save" class="ghost-btn">Save…</button>
        <button id="preset-delete" class="ghost-btn danger">Delete</button>
      </div>
      <div class="popup-row">
        <button id="copy-js" class="ghost-btn">Copy as JS</button>
        <button id="reset-defaults" class="ghost-btn danger">Reset to defaults</button>
      </div>
      <input type="hidden" id="model" value="gemini-3-pro-image-preview" />
    </section>

  </div>
</div>

<!-- ============== Lightbox ============== -->
<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox-close" aria-label="close">×</button>
  <img id="lightbox-img" alt="" />
  <div id="lightbox-info" class="lightbox-info"></div>
</div>

<!-- ============== Modal (preset save / JS export / issue reporter) ============== -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-title">Modal</h3>
      <button id="modal-close" class="ghost-btn">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-foot" class="modal-foot"></div>
  </div>
</div>

<!-- ============== Drag overlay ============== -->
<div id="drag-overlay" class="drag-overlay" hidden>
  <div class="drag-msg">Drop images to add as references</div>
</div>

<script src="app.js"></script>
</body>
</html>
